apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: {{ .Values.ollama.image | default "ollama/ollama:0.31.2" | quote }}
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: {{ .Values.ollama.resources.requests.cpu | default "1" | quote }}
            memory: {{ .Values.ollama.resources.requests.memory | default "2Gi" | quote }}
          limits:
            cpu: {{ .Values.ollama.resources.limits.cpu | default "2" | quote }}
            memory: {{ .Values.ollama.resources.limits.memory | default "4Gi" | quote }}
        # volumeMounts는 container 스펙의 필드라 resources와 형제 레벨이어야 함.
        # 예전엔 resources 블록 안에 중첩되어 있어서 무시(unknown field)되었고,
        # 그 결과 PVC가 pod volume으로는 존재해도 컨테이너에 실제 마운트되지
        # 않아 모델이 계속 ephemeral-storage에 쓰였음 -> PVC를 붙여도
        # disk-pressure eviction이 그대로 재발했던 원인.
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: ollama-models-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
