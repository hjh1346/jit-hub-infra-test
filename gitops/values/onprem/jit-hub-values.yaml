# On-Prem 클러스터 전용 Override Values
# Umbrella Chart (Subchart) 구조에 맞게 작성

ingressRule:
  namespace: "jit-hub"
  host: "cloudinfra.store"
gateway:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/jit-hub-gateway"
    tag: "seed"
auth:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/auth-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.47"
    host: "auth-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-authdb"
weather:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/weather-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.48"
    host: "weather-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-weatherdb"
traffic:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/traffic-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.49"
    host: "traffic-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-trafficdb"
tourist:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/tourist-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.50"
    host: "tourist-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-touristdb"

sllm:
  enabled: true # sLLM 분석 파이프라인은 onprem에서만 활성화 (7/15 팀 결정)
  image:
    repository: "172.16.8.10:30002/jit-hub/sllm-service"
    tag: "cluster-failure-v5"
  loki:
    mode: live
    url: "http://onprem-monitoring-stack-loki.monitoring.svc.cluster.local:3100"
  ollamaTimeoutSeconds: "300"
  ollama:
    persistence:
      enabled: true
      size: "10Gi"
    # qwen2.5:7b(~4.7Gi weights, CPU 추론 시 KV캐시 포함 실사용 6~7Gi대)를 담기 위해
    # 상향. node2는 allocatable memory가 ~3.7Gi뿐이라 물리적으로 못 올라가므로
    # 메모리 여유가 있는 node1에 고정한다.
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        cpu: "1"
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: node1
  analyzeTimeoutSeconds: "300"
  lambdaNotifyUrl: "https://9o97rosq5k.execute-api.ap-northeast-2.amazonaws.com/notify"
  lambdaNotifyTimeoutSeconds: "3"
