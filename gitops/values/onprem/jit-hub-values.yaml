# On-Prem 클러스터 전용 Override Values
# Umbrella Chart (Subchart) 구조에 맞게 작성

ingressRule:
  namespace: "jit-hub"
  host: "cloudinfra.store"
gateway:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/jit-hub-gateway"
    tag: "seed"
auth:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/auth-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.47"
    host: "auth-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-authdb"
weather:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/weather-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.48"
    host: "weather-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-weatherdb"
traffic:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/traffic-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.49"
    host: "traffic-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-trafficdb"
tourist:
  replicaCount: 1
  image:
    repository: "172.16.8.10:30002/jit-hub/tourist-service"
    tag: "seed"
  db:
    enabled: true
    loadBalancerIP: "172.16.8.50"
    host: "tourist-db"
    persistence:
      enabled: true
      size: 100Mi
      nfs:
        server: "172.16.8.203"
        path: "/nfs/shared/jithub-touristdb"

sllm:
  enabled: true # sLLM 분석 파이프라인은 onprem에서만 활성화 (7/15 팀 결정)
  image:
    repository: "172.16.8.10:30002/jit-hub/sllm-service"
    tag: "seed"
  loki:
    mode: live
    url: "http://onprem-monitoring-stack-loki.monitoring.svc.cluster.local:3100"
  ollamaTimeoutSeconds: "300"
  ollamaModel: "qwen2.5:3b" # node2 RAM(~3.7Gi) 한도로 개인 온프레만 3b 사용 (7b는 로딩 시 OOM)
  ollama:
    persistence:
      enabled: true
      size: "10Gi"
    resources:
      requests:
        cpu: "500m"
        memory: "1536Mi"
      limits:
        cpu: "1"
        memory: "3Gi" # qwen2.5:3b 가중치(~1.8Gi)+KV캐시 여유. node2 allocatable ~3.7Gi 한도 내
  analyzeTimeoutSeconds: "300"
